apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-api
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: cloud-api=ghcr.io/readerofvillage/cloud-api
    argocd-image-updater.argoproj.io/cloud-api.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/cloud-api.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/cloud-api.update-strategy: newest-build
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ReaderOfVillage/cloud-storage.git
    targetRevision: main
    path: helm/cloud-api

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true