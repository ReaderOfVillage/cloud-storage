name: CI/CD Deploy to Kubernetes

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

jobs:

  unit-tests:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install system dependency (libmagic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1
 
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
 
      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  smoke-tests:
    runs-on: ubuntu-latest
    needs: unit-tests          # only run if unit tests pass
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Start stack with docker compose
        run: |
          # Override the cloud-api image to build from source so we test
          # the actual code in this commit, not a stale published image.
          docker compose up -d --build
        env:
          SPACES_KEY: minioadmin
          SPACES_SECRET: minioadmin
          SPACES_REGION: us-east-1
 
      - name: Wait for MinIO and create bucket
        run: |
          # Give MinIO a moment, then create the bucket the app expects
          sleep 5
          docker run --rm --network host \
            minio/mc alias set local http://localhost:9000 admin password123
          docker run --rm --network host \
            minio/mc mb local/cloud-storage-dev --ignore-existing
 
      - name: Run smoke tests
        run: |
          chmod +x tests/smoke_test.sh
          BASE_URL=http://localhost:8000 bash tests/smoke_test.sh
 
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/readerofvillage/cloud-api:${{ github.sha }}
          docker build -t $IMAGE .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Push Docker image
        run: |
          docker push $IMAGE

      - name: Update Helm image tag
        run: |
          yq -i '.image.tag = "${{ github.sha }}"' dev/helm/cloud-api/values.yaml

      - name: Commit updated Helm values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add dev/helm/cloud-api/values.yaml
          git commit -m "update cloud-api image to ${{ github.sha }}" || echo "no changes"
          git push