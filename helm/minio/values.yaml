replicaCount: 1

image:
  repository: minio/minio
  tag: latest

rootUser: admin
rootPassword: password123

storage:
  size: 5Gi

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  ingressClassName: nginx

  host: minio.local
  path: /

  tls: []

  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"