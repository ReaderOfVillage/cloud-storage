{{- if .Values.loki.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.loki.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.loki.persistence.size }}
{{- end }}
