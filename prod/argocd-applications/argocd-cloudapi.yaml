apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ReaderOfVillage/cloud-storage.git
    targetRevision: main
    path: prod/helm/cloud-api

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true