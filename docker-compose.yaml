version: '3.9'

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: storage

    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    volumes:
      - minio_data:/data

    ports:
      - "9000:9000"
      - "9001:9001"

  cloud-api:
    image: croomie/cloud-api:4.0
    container_name: cloud-api
    env_file:
      - .env  
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/storage


volumes:
  postgres_data:
  minio_data:
