replicaCount: 1
image:
  repository: ghcr.io/readerofvillage/cloud-api
  tag: 24746e9b64bc5b50723875a88659133401fc0558
secretName: cloud-api-secret
secretNameS3: s3-secret
containerPort: 8000
service:
  port: 8000
  targetPort: 8000
  type: ClusterIP
envFrom:
  - secretRef:
      name: cloud-api-secret
  - secretRef:
      name: s3-secret
volumes:
  - name: tls
    secret:
      secretName: cloud-tls
  - name: config
    configMap:
      name: app-config
  - name: postgres-data
    persistentVolumeClaim:
      claimName: postgres-pvc
ingress:
  enabled: true
  className: nginx
  host: api.dev.internal
  tls:
    enabled: false
  path: /

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"