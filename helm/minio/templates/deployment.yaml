apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1

  selector:
    matchLabels:
      app: minio

  template:
    metadata:
      labels:
        app: minio

    spec:
      containers:
        - name: minio
          image: minio/minio

          args:
            - server
            - /data
            - --console-address
            - ":9001"

          env:
            - name: MINIO_ROOT_USER
              value: admin

            - name: MINIO_ROOT_PASSWORD
              value: password123

            - name: MINIO_BROWSER_REDIRECT_URL
              value: http://{{ .Values.ingress.host }}

            - name: MINIO_SERVER_URL
              value: http://s3.minio.local

          ports:
            - containerPort: 9000
            - containerPort: 9001

          volumeMounts:
            - name: storage
              mountPath: /data

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: minio-pvc