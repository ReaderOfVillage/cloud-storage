apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ReaderOfVillage/cloud-storage.git
    targetRevision: main
    path: helm/loki
    helm:
      releaseName: loki
      values: |
        loki:
          enabled: true
          replicas: 1
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: standard
        promtail:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
