apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "*" 
    helm:
      values: |
        grafana:
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          envFromSecret: grafana-telegram
          sidecar:
            datasources:
              enabled: true
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false
              jsonData:
                maxLines: 1000
          grafana.ini:
            unified_alerting:
              enabled: true
            alerting:
              enabled: false
          provisioning:
            alerting:
              contactpoints.yaml:
                apiVersion: 1
                contactPoints:
                  - orgId: 1
                    name: Telegram
                    receivers:
                      - uid: telegram-receiver
                        type: telegram
                        settings:
                          bottoken: $TELEGRAM_BOT_TOKEN
                          chatid: '1314692948'
                          message: |
                            {{ range .Alerts }}
                            🔴 *{{ .Labels.alertname }}*
                            {{ .Annotations.description }}
                            {{ end }}
              notificationpolicies.yaml:
                apiVersion: 1
                policies:
                  - orgId: 1
                    receiver: Telegram
                    group_wait: 30s
                    group_interval: 5m
                    repeat_interval: 4h

        alertmanager:                          # NEW
          alertmanagerSpec:
            secrets:
              - grafana-telegram
          config:
            global:
              telegram_api_url: https://api.telegram.org
            route:
              receiver: telegram
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: "null"
                  matchers:
                    - alertname="Watchdog"
            receivers:
              - name: "null"
              - name: telegram
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/secrets/grafana-telegram/bot-token
                    chat_id: 1314692948
                    parse_mode: Markdown
                    message: |
                      {{ range .Alerts }}
                      🔴 *{{ .Labels.alertname }}*
                      {{ .Annotations.description }}
                      {{ end }}
            inhibit_rules:
              - source_matchers:
                  - severity="critical"
                target_matchers:
                  - severity=~"warning|info"
                equal: [namespace, alertname]

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true