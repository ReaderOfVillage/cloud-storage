replicaCount: 1
image:
  repository: ghcr.io/readerofvillage/cloud-api
  tag: c0322ff38623b35b280e2d78f4893fc501bee308
secretName: cloud-api-secret
secretNameS3: s3-secret
containerPort: 8000
service:
  port: 8000
  targetPort: 8000
  type: ClusterIP
envFrom:
  - secretRef:
      name: cloud-api-secret
  - secretRef:
      name: s3-secret
volumes:
  - name: tls
    secret:
      secretName: cloud-tls
  - name: config
    configMap:
      name: app-config
  - name: postgres-data
    persistentVolumeClaim:
      claimName: postgres-pvc
ingress:
  enabled: true
  className: nginx
  host: api.dev.internal
  tls:
    enabled: false
  path: /
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  cpuThreshold: 70
  memoryThreshold: 80
  uploadsThreshold: "10"

